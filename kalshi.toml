# Kalshi bot config. Shadow mode only: live public data, virtual money.
[bot]
series = ["KXHIGHNY", "KXHIGHCHI", "KXHIGHMIA", "KXHIGHAUS", "KXHIGHLAX", "KXHIGHDEN", "KXHIGHPHIL",
          # 15 more cities (2026-11-07): the 7-city model made +3.0%/bet out-of-sample on them
          # (+1.6% at +1c, 26/37 weeks up; python3 -m kalshi citycheck --db data/kalshi_new.db)
          "KXHIGHTDC", "KXHIGHTATL", "KXHIGHTMIN", "KXHIGHTDAL", "KXHIGHTSFO", "KXHIGHTHOU", "KXHIGHTLV",
          "KXHIGHTOKC", "KXHIGHTBOS", "KXHIGHTSEA", "KXHIGHTSATX", "KXHIGHTPHX",
          "KXLOWTMIN", "KXLOWTMIA", "KXLOWTLAX",
          # 18 established thinner markets (2026-11-08): +3.2%/bet out-of-sample (+1.8% at +1c).
          # 8 young ones (<20 weeks old: TTN, EWR, SDF, low SAN, high SAN) lost -4.0% and are skipped.
          "KXHIGHTNOLA", "KXLOWTNYC", "KXLOWTPHIL", "KXLOWTATL", "KXLOWTDC", "KXLOWTBOS", "KXLOWTCHI",
          "KXLOWTDAL", "KXLOWTSATX", "KXLOWTHOU", "KXLOWTNOLA", "KXLOWTAUS", "KXLOWTOKC", "KXLOWTPHX",
          "KXLOWTDEN", "KXLOWTLV", "KXLOWTSEA", "KXLOWTSFO",
          "KXJOBLESSCLAIMS", "KXCPIYOY", "KXCPI", "KXPAYROLLS", "KXU3", "KXFEDDECISION", "KXFED", "KXGDP",
          "KXAAAGASD", "KXTSAW"]
# No crypto: walk-forward + $75 sims lost money on every crypto variant (fast traders win there).
start_equity = 75.0
margin = 0.03          # learned win rate must beat our price by 3c
kelly_mult = 0.25      # quarter Kelly
max_frac = 0.10        # never more than 10% of equity on one order
fill_share = 0.25      # when joining a queue, assume we get 25% of prints
min_ttc_s = 120
max_ttc_s = 86400     # only trade the last 24h before close (edge lives there)
max_order_dollars = 7.5
max_open_dollars = 60.0
max_event_dollars = 7.5
daily_loss_halt = 5.0
sizing = "fixed"       # the paper's fixed-fractional rule; Kelly only as a ceiling
fixed_frac = 0.01      # 1% of equity per bet
group_cap_frac = 0.05  # 5% of equity per correlated group (city-day / release day). Replay, $75, 17 months:
                       # 3% -> $434-504 (maxDD 17-24%), 5% -> $1,042-1,074 (23-27%), 8% -> $1.7-3.1k (35-39%),
                       # 12% -> $3.0-4.5k (38-53%). 5% doubles profit for a few points of drawdown.
open_cap_frac = 0.80   # at most 80% of equity in play
veto_gap = 0.20        # a data signal "disagrees" when it puts our side 20c+ below our price
veto_enforce = []      # signals allowed to BLOCK on disagreement. Empty = log only: the weather
                       # check showed forecast vetoes add nothing (python3 -m kalshi wxcheck --pre-day)
max_books_per_step = 200  # ~250 markets with 50 series: every book refreshed within ~2 cycles
out_dir = "data/bot"

[model]
path = "data/cell_model.json"

[news]
cooldown_s = 600
rss = true             # Fed, BEA, BLS, Labor Dept, Hurricane Center, Google News, MarketWatch, CNBC, EIA
bluesky = true         # Reuters, AP, Bloomberg, WSJ, CNBC, NYT, ... newsroom accounts (free; X is paid)
nws_discussions = true # NWS forecasters' discussions for the 7 settlement cities

[signals]              # all free, no keys except Alpaca for SPY/QQQ
calendar = true        # BLS + FOMC + Kalshi release times; after a CPI/jobs/GDP print, pause Fed markets
pause_before_s = 0     # never pause before: last-15-min econ fills were the best (+12%/position)
pause_after_s = 1800
nowcasts = true        # Cleveland Fed CPI, Atlanta Fed GDPNow
weather_forecast = true  # GEFS + ECMWF ensembles, NWS hourly forecast + alerts
gas = true             # AAA national average
tsa = true             # TSA checkpoint counts
equities = true        # SPY/QQQ shock -> pause Fed markets
polymarket = true      # Polymarket Fed-decision odds vs Kalshi (log only)

[x]
enabled = false                  # needs X_BEARER_TOKEN; billed per post read
query = "(bitcoin OR ethereum OR fed OR fomc OR cpi OR payrolls OR hurricane) -is:retweet lang:en"
max_reads_per_day = 200

[spot]
products = []          # crypto markets are off

[notify]
enabled = false                  # phone alerts via NTFY_TOPIC once the shadow run is real
